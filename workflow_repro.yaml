apiVersion: harness.io/v1
kind: Workflow
type: service
identifier: idp_11666_git_cache_gitx
name: IDP-11666 Git cache check
owner: user@harness.io
spec:
  output:
    links:
    - title: Done
      url: https://harness.io
  parameters:
  - title: CACHE_MARKER_V1
    required:
    - marker
    properties:
      marker:
        title: Marker
        type: string
        description: Change this title between commits to see whether the wizard still
          shows the old YAML.
        default: v1
  steps:
  - id: log
    name: Log marker
    action: debug:log
    input:
      message: ${{ parameters.marker }}
metadata:
  description: Remote workflow used to check branch-list cache and workflow.yaml refresh.
  tags:
  - idp-11666
